<form method="post" action="{% url 'client_list' %}">
    {% csrf_token %}
    {% if editing %}<input type="hidden" name="id" value="{{ editing.pk }}">{% endif %}
    {{ form.non_field_errors }}
    <label>
        <span data-i18n="name">Name</span>
        {{ form.name }}
        {{ form.name.errors }}
    </label>
    <label>
        <span data-i18n="phone">Phone</span>
        {{ form.phone }}
    </label>
    <label>
        <span data-i18n="email">Email</span>
        {{ form.email }}
    </label>
    <div class="drawer-actions">
        {% if editing %}
        <button type="submit" name="action" value="delete" class="btn danger" data-i18n="delete">Delete</button>
        {% endif %}
        <button type="submit" name="action" value="save" class="btn primary" data-i18n="save">Save</button>
    </div>
</form>
