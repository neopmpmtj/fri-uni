<div class="row-actions">
    <div class="row-actions__start">
        {% if proforma.can_edit %}
        <a href="{% url 'proforma_detail' proforma.pk %}" data-i18n="edit">Edit</a>
        {% elif proforma.can_change %}
        <form method="post" action="{% url 'proforma_change' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" class="btn-link" data-i18n="change">Change</button>
        </form>
        {% endif %}
    </div>
    <div class="row-actions__end">
        {% if proforma.can_change %}
        <form method="post" action="{% url 'proforma_outcome' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" name="action" value="accept_proforma" class="btn-link" data-i18n="markAccepted" data-confirm-i18n="confirmMarkAccepted">Mark accepted</button>
        </form>
        <form method="post" action="{% url 'proforma_outcome' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" name="action" value="reject_proforma" class="btn-link" data-i18n="markRejected" data-confirm-i18n="confirmMarkRejected">Mark rejected</button>
        </form>
        {% elif proforma.accepted_at %}
        <form method="post" action="{% url 'proforma_outcome' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" name="action" value="unaccept_proforma" class="btn-link" data-i18n="clearAccepted">Clear accepted</button>
        </form>
        {% elif proforma.rejected_at %}
        <form method="post" action="{% url 'proforma_outcome' %}" class="inline-form">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ proforma.pk }}">
            <button type="submit" name="action" value="unreject_proforma" class="btn-link" data-i18n="clearRejected">Clear rejected</button>
        </form>
        {% elif not proforma.can_edit %}
        <span class="muted">—</span>
        {% endif %}
    </div>
</div>
